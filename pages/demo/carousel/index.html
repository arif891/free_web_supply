<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Carousel Demo</title>

        <link rel="stylesheet" href="/layx/components/carousel/carousel.css">

        <link rel="stylesheet" href="/layx/main/base/variable.css">
        <link rel="stylesheet" href="/layx/main/typography/typography.css">
        <link rel="stylesheet" href="/layx/main/base/base.css">
        <link rel="stylesheet" href="/layx/main/container/container.css">

        <style>
            body {
                background-image: url(/assets/image/demo/common/bg-5.avif);
                background-size: cover;
                background-position: center;
            }

            .demo__container {
                margin: 0;
            }

            .demo__carousel {
                padding-top: 1rem;
                --min-height: 44svh;
                --gap: .5rem;

                .item {
                    display: grid;
                    place-items: center;
                    background-size: cover;
                    background-position: center;

                    h3 {
                        user-select: none;
                        color: #fff;
                    }
                }
            }
        </style>

    </head>

    <body>
        <container class="demo__container">
            <carousel class="demo__carousel" indicators controls>
                <div class="scroller" data-drag-scroll="x" data-drag-scroll-multiplier="2.5">
                    <div class="item" style="background-image: url(/assets/image/demo/common/1.webp);">
                        <h3>Slide 1</h3>
                    </div>
                    <div class="item" style="background-image: url(/assets/image/demo/common/2.webp);">
                        <h3>Slide 2</h3>
                    </div>
                    <div class="item" style="background-image: url(/assets/image/demo/common/6.webp);">
                        <h3>Slide 3</h3>
                    </div>
                    <div class="item" style="background-image: url(/assets/image/demo/common/11.webp);">
                        <h3>Slide 4</h3>
                    </div>
                    <div class="item" style="background-image: url(/assets/image/demo/common/17.webp);">
                        <h3>Slide 5</h3>
                    </div>
                    <div class="item" style="background-image: url(/assets/image/demo/common/18.webp);">
                        <h3>Slide 6</h3>
                    </div>
                </div>
            </carousel>

            <carousel class="demo__carousel" indicators="top left" controls="top" snap="none">
                <div class="scroller" data-drag-scroll="x" data-drag-scroll-momentum="1">
                    <div class="item" style="background-image: url(/assets/image/demo/common/1.webp);">
                        <h3>Slide 1</h3>
                    </div>
                    <div class="item" style="background-image: url(/assets/image/demo/common/2.webp);">
                        <h3>Slide 2</h3>
                    </div>
                    <div class="item" style="background-image: url(/assets/image/demo/common/6.webp);">
                        <h3>Slide 3</h3>
                    </div>
                    <div class="item" style="background-image: url(/assets/image/demo/common/11.webp);">
                        <h3>Slide 4</h3>
                    </div>
                    <div class="item" style="background-image: url(/assets/image/demo/common/17.webp);">
                        <h3>Slide 5</h3>
                    </div>
                    <div class="item" style="background-image: url(/assets/image/demo/common/18.webp);">
                        <h3>Slide 6</h3>
                    </div>
                </div>
            </carousel>
        </container>

        <script type="module">
            // Polyfill for Safari anf Firefox
            if (!CSS.supports('scroll-marker-group', 'after')) {
                import("/layx/components/carousel/polyfill.js");
            }

            // Optional drag scroll
            const hasPointerFine = window.matchMedia("(pointer: fine)").matches;
            if (hasPointerFine) {
                import("/layx/others/drag_scroll/drag_scroll.js");
            }
        </script>


    
    <script src="/_vercel/insights/script.js" type="module" fetchpriority="low"></script>
</body>

</html>
